version: 2

project_name: eth-watch

builds:
  - id: eth-watch
    binary: eth-watch
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: binary
    format: binary
  - id: tarball
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# owner/name 未填时使用 GITHUB_REPOSITORY（当前仓库）
release:
  draft: false
  # 若需适配任意仓库，可改为不填 owner/name，由 CI 环境自动识别
